[package]
name = "eksigo"
version = "0.1.0"
description = "Dictation practice with real podcasts"
authors = ["Jomo"]
edition = "2024"
default-run = "eksigo"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "eksigo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41.1", features = ["bundled"] }
symphonia = { version = "0.6.1", default-features = false, features = ["mp3", "aac", "isomp4", "wav", "pcm", "flac", "ogg", "vorbis"] }
rubato = "5.0.1"
anyhow = "1.0.104"
tauri-plugin-dialog = "2.8.4"
whisper-rs = "0.16.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "query", "stream", "gzip", "charset", "http2"] }
rss = "2.1.2"
chrono = "0.4.45"
futures-util = "0.3.34"
signalsmith-stretch = "0.1.3"
rodio = { version = "0.23.0", default-features = false, features = ["playback"] }
tokio = { version = "1.54.1", features = ["sync", "fs", "io-util"] }
sha2 = "0.11.1"
hex = "0.4.3"
flate2 = "1"
rs-fsrs = { version = "1.2.1", features = ["serde"] }

# whisper.cpp runs on the GPU through Metal on Mac; Windows uses the CPU build.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }


# Dependencies (whisper.cpp, the audio decoder, the resampler) are optimised even in dev builds;
# unoptimised, decoding and transcribing an episode would take minutes.
[profile.dev.package."*"]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
