# iOS tests (DESIGN.md section 12, "Development workflow"): build the app and run its tests on a simulator, for pull requests
# that change the app (called by ci.yml) and on main after a merge. No signing: the simulator needs none.
name: ios

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_call:

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Use the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
      - name: Pick an iPhone simulator
        id: sim
        run: |
          id=$(xcrun simctl list devices available -j \
            | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k in sorted(d, reverse=True) if "iOS" in k for x in d[k] if x["name"].startswith("iPhone")))')
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Build and test
        working-directory: ios
        run: |
          xcodebuild test -project Eksigo.xcodeproj -scheme Eksigo -quiet \
            -destination "id=${{ steps.sim.outputs.id }}" \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      # -quiet hides why a test failed.
      - name: Say why tests failed
        if: failure()
        run: |
          xcrun xcresulttool get test-results tests --path "$RUNNER_TEMP/tests.xcresult" \
            | python3 -c '
          import json, sys

          def walk(node, path=""):
              name = node.get("name", "")
              if node.get("nodeType") == "Failure Message":
                  print(f"{path}: {name}")
              for child in node.get("children", []):
                  walk(child, name if node.get("nodeType") == "Test Case" else path)

          for root in json.load(sys.stdin).get("testNodes", []):
              walk(root)
          '
