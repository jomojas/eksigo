# Pull request checks (DESIGN.md section 12, "Development workflow"). Runs on every pull request; each part runs only
# when its folder changed, and `passed` sums them up. `passed` is the one check main requires before a merge (a
# required check that never ran would block the merge, so the path filters live here instead of on the workflow).
# The iOS job is added when the iOS app moves into this repo.
name: ci

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # the pull request's list of changed files
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      desktop: ${{ steps.filter.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend: ["backend/**", ".github/workflows/ci.yml", ".github/workflows/backend.yml", ".github/workflows/backend-test.yml"]
            desktop: ["desktop/**", ".github/workflows/ci.yml", ".github/workflows/desktop-test.yml"]

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    uses: ./.github/workflows/backend-test.yml

  desktop:
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    uses: ./.github/workflows/desktop-test.yml

  passed:
    needs: [changes, backend, desktop]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every part that ran passed
        run: |
          echo "backend: ${{ needs.backend.result }}, desktop: ${{ needs.desktop.result }}"
          [[ "${{ needs.changes.result }}" == success ]]
          [[ "${{ needs.backend.result }}" =~ ^(success|skipped)$ ]]
          [[ "${{ needs.desktop.result }}" =~ ^(success|skipped)$ ]]
