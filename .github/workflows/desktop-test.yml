# Desktop checks on macOS and Windows: the interface type-checks and builds, the Rust tests pass, the app compiles,
# and Whisper transcribes a sample on each system (the timing goes in the job summary). The phrase translator
# (desktop/translate) is built first: the app bundles it, so the app's own build needs it. Called from ci.yml.
name: desktop-test

on:
  workflow_call:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # As in release.yml: whisper.cpp built for a common processor, not this runner's. Otherwise a build cached on a
      # newer runner crashes on an older one (exit code 132, an instruction the processor doesn't have).
      GGML_NATIVE: "OFF"
      GGML_AVX: "ON"
      GGML_AVX2: "ON"
      GGML_FMA: "ON"
      GGML_F16C: "ON"
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          # Bumped when GGML_* below change: whisper.cpp's build doesn't notice them, so the cached copy would stay.
          key: ggml-generic-cpu-v1
          workspaces: |
            desktop/src-tauri
            desktop/translate

      - name: Interface (type-check and build)
        run: |
          npm ci
          npm run build

      - name: Build the phrase translator, and its tests
        run: |
          node scripts/translator.mjs
          cargo test --release --locked --manifest-path translate/Cargo.toml

      - name: Rust tests
        working-directory: desktop/src-tauri
        run: cargo test

      - name: Build the app and the Whisper benchmark
        working-directory: desktop/src-tauri
        run: cargo build --bins --features bench

      - name: Cache the speech model
        uses: actions/cache@v4
        with:
          path: desktop/models
          key: whisper-ggml-base.en-v1

      - name: Download the speech model and a sample
        run: |
          mkdir -p models
          [ -f models/ggml-base.en.bin ] || curl -sSfL -o models/ggml-base.en.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
          curl -sSfL -o models/jfk.wav https://raw.githubusercontent.com/ggml-org/whisper.cpp/master/samples/jfk.wav

      - name: Whisper on ${{ runner.os }}
        working-directory: desktop/src-tauri
        run: |
          ./target/debug/whisper-bench ../models/ggml-base.en.bin ../models/jfk.wav | tee bench.txt
          grep -qi "country" bench.txt
          {
            echo "### Whisper on ${{ runner.os }}"
            echo '```'
            cat bench.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
