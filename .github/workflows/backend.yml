# Server CD (DESIGN.md section 12): after a merge into main, test -> build image -> push to ghcr.io -> deploy to the
# VPS. Pull requests are tested by ci.yml.
name: backend

on:
  push:
    branches: [main]
    paths: ["backend/**", "site/**", ".github/workflows/backend.yml", ".github/workflows/backend-test.yml"]

jobs:
  test:
    uses: ./.github/workflows/backend-test.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.name.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}-backend" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.name.outputs.image }}:latest
            ${{ steps.name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Off until the repository variable DEPLOY_ENABLED is set to true (backend/README.md, "Switching the VPS to v2").
  # Needs the secrets VPS_HOST, VPS_USER and VPS_SSH_KEY.
  deploy:
    needs: image
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: backend/deploy/docker-compose.yml,backend/deploy/Caddyfile
          target: /opt/eab
          strip_components: 2
      - uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: site
          target: /opt/eab
          rm: false
      - uses: appleboy/ssh-action@v1.2.0
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          # The job's own token pulls the private image; it expires with the job, so log out after.
          envs: GHCR_TOKEN,GHCR_USER
          script: |
            cd /opt/eab
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker logout ghcr.io
            docker compose up -d --remove-orphans
            docker compose restart caddy
            docker image prune -f
